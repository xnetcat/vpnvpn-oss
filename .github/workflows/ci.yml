name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (tauri-cli)
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/tauri
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-cli-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}

      - name: Install Linux dependencies (for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked

      - name: Install dependencies
        run: |
          bun install

      - name: Lint
        run: |
          bun run lint

      - name: Test
        run: |
          bun run test

      - name: Build
        # The desktop Tauri bundle (frontend + daemon sidecar + platform
        # packaging) is built and validated separately by desktop-build.yml on
        # every target. Rebuilding it here would be redundant and needs the
        # platform-specific bundling/webkit toolchain, so exclude it.
        run: |
          bun run build --filter='!@vpnvpn/desktop'
