name: E2E Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/vpn-server
            apps/desktop/daemon
          shared-key: rust-tests

      - name: Install dependencies
        run: bun install

      - name: Install desktop daemon Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libdbus-1-dev pkg-config

      - name: Run Rust unit tests (vpn-server)
        working-directory: apps/vpn-server
        run: cargo test

      - name: Run Rust unit tests (desktop daemon)
        working-directory: apps/desktop/daemon
        run: cargo test

      - name: Run TypeScript tests
        run: bun run test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5

      - name: Run E2E test suite
        working-directory: e2e
        run: bash run-e2e.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/logs/
          if-no-files-found: ignore
